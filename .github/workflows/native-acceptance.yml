name: Native styling acceptance
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter '@veebox/*' build
      # Local workspace bins cannot be linked until their built entry points exist.
      - run: pnpm install --frozen-lockfile --ignore-scripts --offline
      - run:
          pnpm --filter @vbox/acceptance exec playwright install --with-deps
          chromium firefox webkit
      - run: pnpm --filter @vbox/acceptance type-check
      - run: pnpm --filter @vbox/acceptance test:editor
      - run: pnpm --filter @vbox/acceptance test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces
          path: apps/acceptance/test-results
